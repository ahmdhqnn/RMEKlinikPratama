services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-klinik_pratama}
      POSTGRES_USER: ${DB_USERNAME:-klinik_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-local-password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - klinik_postgres_data:/var/lib/postgresql/data
      - ./database/init-test-db.sh:/docker-entrypoint-initdb.d/10-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-klinik_app} -d ${DB_DATABASE:-klinik_pratama}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  klinik_postgres_data:
